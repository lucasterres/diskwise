name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Validate JSON manifests
        shell: bash
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json hooks/hooks.json diskwise.example.json; do
            python -m json.tool "$f" > /dev/null
          done

      - name: Hook launcher smoke test
        shell: bash
        run: |
          echo '{"session_id":"ci","cwd":"."}' | bash hooks/run-hook.sh session-start | python -m json.tool > /dev/null

      - name: Run tests
        run: python -m unittest discover -s tests -v
